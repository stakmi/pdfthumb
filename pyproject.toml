[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfthumb"
dynamic = ["version"]
description = "Generate WebP thumbnails from PDF files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pdf", "thumbnail", "webp", "pymupdf"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Typing :: Typed",
]
dependencies = ["pymupdf>=1.23", "pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pdfthumb = "pdfthumb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "pdfthumb.__version__" }

[tool.setuptools.package-data]
pdfthumb = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

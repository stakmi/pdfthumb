name: Publish to PyPI

# Release flow:
#   1. On GitHub: Releases -> "Draft a new release" -> create a tag such as 0.1.2 or v0.1.2 -> Publish.
#   2. This workflow tests and builds the package, stamps the version from the tag,
#      publishes it to PyPI and attaches the wheel/sdist to the release.
# Manual "Run workflow" builds the current __version__ and publishes it to TestPyPI (dry run).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine packaging
      - name: Set package version from release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          python - "$VERSION" <<'PY'
          import pathlib, re, sys
          from packaging.version import Version, InvalidVersion
          v = sys.argv[1]
          try:
              v = str(Version(v))
          except InvalidVersion:
              sys.exit(f"::error::Release tag '{v}' is not a valid PEP 440 version (expected e.g. 1.2.3 or v1.2.3)")
          p = pathlib.Path("src/pdfthumb/__init__.py")
          s, n = re.subn(r'^__version__ = ".*"$', f'__version__ = "{v}"', p.read_text(), flags=re.M)
          if n != 1:
              sys.exit("::error::__version__ not found in src/pdfthumb/__init__.py")
          p.write_text(s)
          print(f"Building version {v}")
          PY
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: twine check --strict dist/*
      - name: Verify wheel installs
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/pdfthumb --version
          /tmp/v/bin/python -c "import pdfthumb; print(pdfthumb.__all__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pdfthumb
    permissions:
      id-token: write   # Trusted Publishing (OIDC), no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pdfthumb
    permissions:
      id-token: write   # Trusted Publishing (OIDC), no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  upload-release-assets:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
